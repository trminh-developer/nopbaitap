<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload File</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">
        <div class="header">
            <div class="badge">🚀 Upload Portal</div>
            <h1>NỘP BÀI TẬP</h1>
        </div>

        <div class="card">
            <!-- Tên người nộp -->
            <div class="field">
                <label>Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nguyễn Văn A" />
            </div>

            <!-- Email -->
            <div class="field">
                <label>Email</label>
                <input type="email" id="email" placeholder="email@example.com" />
            </div>

            <!-- Ghi chú -->
            <div class="field">
                <label>Ghi chú (tùy chọn)</label>
                <textarea id="note" placeholder="Bài tập tuần 3, nhóm 2..."></textarea>
            </div>

            <!-- Drop Zone -->
            <div class="field">
                <label>Chọn file</label>
                <div class="dropzone" id="dropzone">
                    <input type="file" id="fileInput" multiple
                        accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.jpg,.png" />
                    <span class="icon">📂</span>
                    <div class="primary-text">Kéo thả file vào đây</div>
                    <div class="sub-text">hoặc click để chọn · PDF, Word, Excel, ảnh, ZIP</div>
                </div>

                <!-- Danh sách file đã chọn -->
                <div class="file-list" id="fileList"></div>

                <!-- Thanh tiến trình -->
                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">
                ☁️ &nbsp;Nộp bài
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>

</html>
