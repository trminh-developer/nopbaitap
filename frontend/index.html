<!doctype html>
<html lang="vi" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Nộp bài tập trực tuyến lên Google Drive. Chọn file, điền thông tin và nhận liên kết xác nhận.">
  <meta name="theme-color" content="#0b0d17">
  <title>Nộp Bài Tập</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%238d83ed'/%3E%3Cpath d='M18 34l14-14 14 14M32 21v26' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
    crossorigin="anonymous"></script>
  <script defer src="vendor/axios/axios.min.js"></script>
  <script defer src="upload-core.js"></script>
  <script defer src="app.js"></script>
</head>

<body>
  <main class="container">
    <section class="row align-items-center hero g-5" aria-labelledby="hero-title">
      <div class="col-lg-6" id="nop-bai">
        <section class="upload-card" aria-labelledby="form-title">
          <div class="d-flex align-items-start justify-content-between mb-4">
            <h2 id="form-title">Nộp bài tập</h2>
          </div>
          <div id="appError" class="alert alert-danger" role="alert" hidden></div>
          <noscript>
            <p class="alert alert-warning">Vui lòng bật JavaScript để nộp bài.</p>
          </noscript>
          <form id="uploadForm" novalidate>
            <fieldset id="formFields">
              <legend class="visually-hidden">Thông tin và file bài tập</legend>
              <div class="row g-3">
                <div class="col-sm-6">
                  <label class="form-label" for="studentName">Họ và tên</label>
                  <input class="form-control" id="studentName" name="studentName" autocomplete="name"
                    placeholder="Nhập họ và tên" required maxlength="150" aria-describedby="nameError">
                  <div class="invalid-feedback" id="nameError">Vui lòng nhập họ và tên.</div>
                </div>
                <div class="col-sm-6">
                  <label class="form-label" for="studentId">IDSV:</label>
                  <input class="form-control" id="studentId" name="studentId" autocomplete="off"
                    placeholder="Mã sinh viên của bạn" required minlength="6" maxlength="10"
                    aria-describedby="studentIdError">
                  <div class="invalid-feedback" id="studentIdError">Vui lòng nhập mã sinh viên</div>
                </div>
                <div class="col-sm-6">
                  <label class="form-label" for="studentClass">Lớp</label>
                  <input class="form-control" type="text" id="studentClass" name="studentClass" placeholder="VD: IT25B"
                    autocomplete="on" required maxlength="64">
                </div>
                <div class="col-sm-6">
                  <label class="form-label" for="course">Học phần</label>
                  <input class="form-control" type="text" id="course" name="course" placeholder="Nhập học phần" required
                    maxlength="150">
                </div>
              </div>
              <div class="attachment-heading"><span>FILE BÀI TẬP</span><span>Tối đa 1 GB / file</span></div>
              <button class="dropzone w-100" id="dropzone" type="button" aria-describedby="fileHelp filesError">
                <svg class="upload-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.5" aria-hidden="true">
                  <path d="M7 17H5a4 4 0 0 1-.7-7.94A7 7 0 0 1 18 7.2 5 5 0 0 1 19 17h-2" stroke-linecap="round" />
                  <path d="m8 14 4-4 4 4m-4-4v11" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="d-block dropzone-title">Kéo &amp; thả bài tập vào đây</span><span
                  class="d-block dropzone-caption">hoặc <span>chọn file từ thiết bị</span></span><span
                  class="d-block file-help" id="fileHelp">Chọn nhiều file cùng lúc · Tối đa 10 file</span>
              </button>
              <input type="file" id="fileInput" multiple hidden>
              <p id="filesError" class="file-error mt-2 mb-0" hidden>Vui lòng chọn ít nhất một file.</p>
              <div class="alert alert-warning mt-3 mb-0 small" id="selectionFeedback" role="status" hidden></div>
              <section id="fileSection" class="mt-3" aria-label="Các file đã chọn" hidden>
                <div class="d-flex justify-content-between align-items-center mb-2"><span id="fileCount"
                    class="small"></span><button type="button" class="btn btn-link btn-sm p-0" id="clearFiles">Xóa tất
                    cả</button></div>
                <ul id="fileList" class="list-unstyled mb-0 file-list"></ul>
              </section>
              <div class="upload-progress mt-3" id="progressSection" role="status" aria-live="polite" hidden>
                <p id="progressLabel" class="small mb-2">Đang chuẩn bị file…</p>
                <div class="progress" role="progressbar" aria-label="Tiến trình nộp bài" aria-valuemin="0"
                  aria-valuemax="100" aria-valuenow="0" id="progressTrack">
                  <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated"></div>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 submit-button mt-4"><span
                  class="spinner-border spinner-border-sm me-2" id="submitSpinner" aria-hidden="true"
                  hidden></span><span id="submitLabel">Gửi bài tập</span></button>
            </fieldset>
          </form>
        </section>
      </div>
    </section>

  </main>
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h2 class="modal-title fs-5" id="confirmTitle">Xác nhận nộp bài</h2><button type="button" class="btn-close"
            data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body pt-0">
          <p class="text-body-secondary">Kiểm tra thông tin trước khi nộp bài.</p>
          <dl id="confirmDetails" class="review-details mb-0"></dl>
        </div>
        <div class="modal-footer border-0"><button type="button" class="btn btn-outline-secondary"
            data-bs-dismiss="modal">Quay lại</button><button type="button" class="btn btn-primary"
            id="confirmSubmit">Xác nhận gửi bài</button></div>
      </div>
    </div>
  </div>
  <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h2 class="modal-title fs-5" id="resultTitle"></h2><button type="button" class="btn-close"
            data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>
        <div class="modal-body pt-0">
          <p id="resultMessage" class="text-body-secondary"></p>
          <ul id="resultFiles" class="list-unstyled receipt-list mb-0"></ul>
        </div>
        <div class="modal-footer border-0"><button type="button" class="btn btn-primary"
            data-bs-dismiss="modal">Đóng</button></div>
      </div>
    </div>
  </div>
</body>

</html>
